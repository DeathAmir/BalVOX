name: Windows x64 Build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/shaders | Out-Null
          Copy-Item build/Release/BalVOX.exe dist/
          Copy-Item README.md dist/
          Copy-Item shaders/ground.fs dist/shaders/
          Compress-Archive -Path dist/* -DestinationPath BalVOX-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: BalVOX-Windows-x64
          path: BalVOX-Windows-x64.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BalVOX-Windows-x64.zip
          generate_release_notes: true
