name: BalVOX Windows x64

on:
  push:
    branches: [wicked-engine]
    tags: ["wicked-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout BalVOX
        uses: actions/checkout@v4

      - name: Configure Wicked Engine and BalVOX
        run: cmake -S . -B build -A x64 -DWICKED_EDITOR=OFF -DWICKED_TESTS=OFF -DWICKED_IMGUI_EXAMPLE=OFF -DWICKED_WINDOWS_TEMPLATE=OFF -DWICKED_ENABLE_SYMLINKS=OFF

      - name: Build BalVOX
        run: cmake --build build --config Release --target BalVOX --parallel 2

      - name: Verify packaged runtime
        shell: pwsh
        run: |
          $exe = "build/bin/BalVOX.exe"
          $dll = "build/bin/dxcompiler.dll"
          $scene = "build/bin/Content/terrain/grass.wiscene"
          foreach ($path in @($exe, $dll, $scene)) {
            if (-not (Test-Path $path)) { throw "Required runtime file missing: $path" }
          }
          $binary = [System.IO.File]::ReadAllBytes($exe)
          if ($binary.Length -lt 4096 -or $binary[0] -ne 0x4D -or $binary[1] -ne 0x5A) {
            throw "BalVOX.exe is not a valid Windows executable"
          }

      - name: Package Windows x64
        shell: pwsh
        run: Compress-Archive -Path build/bin/* -DestinationPath BalVOX-Windows-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BalVOX-Windows-x64
          path: BalVOX-Windows-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/wicked-v')
        uses: softprops/action-gh-release@v2
        with:
          files: BalVOX-Windows-x64.zip
          generate_release_notes: true
